seed = "0x7dd329dcb6426b6a7b3236d84ade60085e6047dcdeebfd61a8f354d852d6fc70"

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = true

[fmt]
line_length = 120

[profile.mainnet]
test = "rehearsal"
